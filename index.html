<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Application</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <header>
            <h1>Quiz Application</h1>
            <p>Test your knowledge and challenge yourself!</p>
        </header>

        <!-- Start Screen -->
        <section id="startScreen" class="card">
            <h2>Start Quiz</h2>

            <div class="settings">

                <div>
                    <label for="category">Category</label>
                    <select id="category">
                        <option value="all">All Categories</option>
                        <option value="science">Science</option>
                        <option value="technology">Technology</option>
                        <option value="general">General Knowledge</option>
                    </select>
                </div>

                <div>
                    <label for="difficulty">Difficulty</label>
                    <select id="difficulty">
                        <option value="all">All Levels</option>
                        <option value="easy">Easy</option>
                        <option value="medium">Medium</option>
                        <option value="hard">Hard</option>
                    </select>
                </div>

            </div>

            <button id="startBtn" class="primary-btn">
                Start Quiz
            </button>
        </section>

        <!-- Quiz Screen -->
        <section id="quizScreen" class="card hidden">

            <div class="quiz-top">
                <span id="questionNumber">Question 1</span>
                <span id="timer">15s</span>
            </div>

            <div class="progress-container">
                <div id="progressBar"></div>
            </div>

            <h2 id="question"></h2>

            <div id="answers" class="answers"></div>

            <button id="nextBtn" class="primary-btn" disabled>
                Next Question
            </button>

        </section>

        <!-- Result Screen -->
        <section id="resultScreen" class="card hidden">

            <h2>Quiz Completed! 🎉</h2>

            <p>Your Final Score</p>

            <div class="score">
                <span id="finalScore">0</span>
                /
                <span id="totalQuestions">0</span>
            </div>

            <p id="resultMessage"></p>

            <button id="restartBtn" class="primary-btn">
                Restart Quiz
            </button>

        </section>

    </div>

    <script src="script.js"></script>

</body>
</html>
